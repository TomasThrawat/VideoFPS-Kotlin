name: Build APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK
        run: |
          if [[ -z "$ANDROID_SDK_ROOT" && -n "$ANDROID_HOME" ]]; then
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          fi
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [[ -z "$SDK" || ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" && ! -x "$SDK/cmdline-tools/16.0/bin/sdkmanager" ]]; then
            echo "Android SDK with sdkmanager was not found."
            exit 2
          fi
          if [[ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]]; then
            echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          else
            echo "$SDK/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          fi

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Restore native library cache
        uses: actions/cache@v5
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a
            app/src/main/cpp/ffmpeg/include
          key: native-ffmpeg-9.0.2-openh264-2.6.0-ndk-28.2.13676358-arm64-v8a-v6

      - name: Build FFmpeg and OpenH264
        run: |
          if [[ -f app/src/main/jniLibs/arm64-v8a/libvideofps.so &&
                -f app/src/main/jniLibs/arm64-v8a/libavutil.so &&
                -f app/src/main/jniLibs/arm64-v8a/libc++_shared.so ]]; then
            echo "Using cached native libraries."
          else
            chmod +x scripts/build_native.sh
            scripts/build_native.sh
          fi

      - name: Verify native libraries
        run: |
          set -e
          test -s app/src/main/jniLibs/arm64-v8a/libvideofps.so
          test -s app/src/main/jniLibs/arm64-v8a/libc++_shared.so
          test -s app/src/main/jniLibs/arm64-v8a/libopenh264.so.8
          test -s app/src/main/jniLibs/arm64-v8a/libavutil.so
          test -s app/src/main/jniLibs/arm64-v8a/libavcodec.so
          test -s app/src/main/jniLibs/arm64-v8a/libavformat.so
          test -s app/src/main/jniLibs/arm64-v8a/libavfilter.so
          test -s app/src/main/jniLibs/arm64-v8a/libswscale.so
          test -s app/src/main/jniLibs/arm64-v8a/libswresample.so

      - name: Run Android lint
        run: |
          gradle --no-daemon --stacktrace --warning-mode all lintDebug

      - name: Build debug APK
        run: |
          gradle --no-daemon --stacktrace --warning-mode all assembleDebug

      - name: Verify APK
        run: |
          set -e
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F "lib/arm64-v8a/libvideofps.so"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F "lib/arm64-v8a/libc++_shared.so"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: VideoFPS-Kotlin-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
